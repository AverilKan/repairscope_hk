services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repairscope
      POSTGRES_PASSWORD: repairscope
      POSTGRES_DB: repairscope
    ports:
      - "5432:5432"
    volumes:
      - repairscope-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairscope -d repairscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  repairscope-postgres-data:
